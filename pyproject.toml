[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvm-mcp"
version = "0.1.0"
description = "Servidor MCP para busca e tratamento de dados financeiros abertos da CVM (Comissão de Valores Mobiliários)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Igor Moreira Carvalho" }]
keywords = ["mcp", "cvm", "financas", "dados-abertos", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # Limite superior obrigatório: o servidor usa mcp.server.fastmcp.FastMCP,
    # que foi removido na 2.0 (substituído por mcp.server.MCPServer). Sem o
    # teto, uma reinstalação puxa a 2.0 e o servidor para de subir.
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27",
    "pandas>=2.0",
    "platformdirs>=4.0",
]

[project.scripts]
cvm-mcp = "cvm_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cvm_mcp"]

[project.urls]
Homepage = "https://github.com/IgormCarvalho/cvm-mcp"
